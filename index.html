<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arnav Chess Arena</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.js"></script>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

#board {
  width: 500px;
  margin: 40px auto;
}

.hack-screen {
  background: black;
  color: #00ff00;
  height: 100vh;
  padding: 20px;
  font-family: monospace;
}
</style>
</head>

<body>

<h1>Arnav Chess Arena ♟️</h1>
<div id="board"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  var game = new Chess();

  function onDragStart (source, piece) {
    if (game.game_over()) return false;
    if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
        (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
      return false;
    }
  }

  function onDrop (source, target) {
    var move = game.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (move === null) return 'snapback';
  }

  var board = Chessboard('board', {
    draggable: true,
    position: 'start',
    onDragStart: onDragStart,
    onDrop: onDrop
  });

});

/* SECRET HACK MODE */
document.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === "H") {
    activateHackMode();
  }
});

function activateHackMode() {
  document.body.innerHTML = `
  <div class="hack-screen">
    <h2>DEVELOPER ACCESS INITIATED...</h2>
    <p id="hackText"></p>
  </div>
  `;

  let messages = [
    "Scanning board engine...",
    "Injecting override protocol...",
    "Bypassing security layers...",
    "Binary stream initiated...",
    "ROOT ACCESS GRANTED",
    "SUCCESSFUL! FILES COPIED"
  ];

  let i = 0;

  let interval = setInterval(() => {
    if (i < messages.length) {
      document.getElementById("hackText").innerHTML += messages[i] + "<br>";
      i++;
    } else {
      clearInterval(interval);
      setTimeout(() => {
        document.body.style.background = "black";
        document.body.innerHTML = "";
      }, 2000);
    }
  }, 1200);
}

/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
