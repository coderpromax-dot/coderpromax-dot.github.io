<!DOCTYPE html>
<html>
<head>
<title>command_prompt_1</title>
<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: Consolas, monospace;
  overflow: hidden;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

#terminal {
  position: relative;
  z-index: 1;
  padding: 20px;
  white-space: pre-wrap;
  font-size: 18px;
}

.dialog {
  display: none;
  position: relative;
  z-index: 2;
  width: 500px;
  background: #111;
  border: 2px solid #00ff00;
  margin: 20px;
  box-shadow: 0 0 15px #00ff00;
}

.titlebar {
  background: #222;
  padding: 6px 10px;
  display: flex;
  justify-content: space-between;
  color: white;
  font-size: 14px;
  user-select: none;
}

.titlebar .buttons span {
  margin-left: 8px;
  pointer-events: none;
}

.dialog-content {
  padding: 20px;
  text-align: center;
  font-size: 18px;
}

.spinner {
  border: 4px solid #003300;
  border-top: 4px solid #00ff00;
  border-radius: 50%;
  width: 35px;
  height: 35px;
  animation: spin 1s linear infinite;
  margin: 15px auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="terminal"></div>

<div class="dialog" id="dialogBox">
  <div class="titlebar">
    <div>command_prompt_1</div>
    <div class="buttons">
      <span>-</span>
      <span>✕</span>
    </div>
  </div>
  <div class="dialog-content" id="dialogContent">
    ACCESS GRANTED
  </div>
</div>

<script>
// MATRIX BACKGROUND
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let i = 0; i < columns; i++) {
  drops[i] = 1;
}

let matrixInterval = setInterval(drawMatrix, 35);

function drawMatrix() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;
    drops[i]++;
  }
}

// TERMINAL
const terminal = document.getElementById("terminal");
const dialog = document.getElementById("dialogBox");
const dialogContent = document.getElementById("dialogContent");

const lines = [
"C:\\Users\\Target> scan_network.exe",
"Scanning network ports...",
"Establishing secure tunnel...",
"Bypassing firewall protocols...",
"Extracting device credentials...",
"Decrypting local registry...",
"Tracing IP route...",
"IP LOCATION FOUND: PUNE, MAHARASHTRA"
];

let i = 0;

function typeLine() {
  if (i < lines.length) {
    terminal.innerHTML += lines[i] + "\n\n";
    i++;
    setTimeout(typeLine, 4000);
  } else {
    setTimeout(showDialog, 5000);
  }
}

function showDialog() {
  dialog.style.display = "block";

  setTimeout(() => {
    let percent = 0;

    dialogContent.innerHTML = `
      <div class="spinner"></div>
      <div id="copyText">Copying files... 0%</div>
    `;

    const copyText = document.getElementById("copyText");

    const interval = setInterval(() => {
      percent += Math.floor(Math.random() * 7) + 3;
      if (percent >= 100) {
        percent = 100;
        clearInterval(interval);

        setTimeout(() => {
          dialogContent.innerHTML = "SUCCESSFUL! FILES COPIED";

          // STOP MATRIX
          clearInterval(matrixInterval);

          // BLACKOUT after 4 seconds
          setTimeout(() => {
            document.body.innerHTML = "";
            document.body.style.background = "black";
          }, 4000);

        }, 2000);
      }
      copyText.innerText = "Copying files... " + percent + "%";
    }, 1200);

  }, 8000);
}

typeLine();
</script>

</body>
</html>
